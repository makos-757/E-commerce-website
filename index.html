<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makos Tech Store</title>
  <!-- environment: macOS | zsh | Node.js frontend demo site -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://media.makostech.me/images/images/MT-logo.png" type="image/png">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="logo" aria-label="Makos Tech Home">
        <img src="https://media.makostech.me/images/images/MT-logo.png" alt="Makos Tech Logo" width="80" height="80">
      </a>
      <nav class="header-nav" aria-label="Main navigation">
        <a href="#" class="nav-link">Home</a>
        <a href="https://makostech.me/about" class="nav-link">About</a>
        <a href="https://makostech.me/contact" class="nav-link">Contact</a>
        <a href="https://makostech.me/blog" class="nav-link">Blog</a>
        <a href="#cart" class="cart-toggle" id="cartToggle" aria-label="View cart">
          <svg class="cart-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Cart <span id="cartCount" class="cart-badge">0</span>
        </a>
        <button class="cart-toggle" id="wishlistToggle" aria-label="View wishlist">
          <svg class="cart-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          Wishlist <span id="wishlistCount" class="cart-badge">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section id="products" class="products-section">
      <div class="container">
        <h1 class="section-title">Our Products</h1>
        <div class="product-grid" id="productGrid">
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Makos Tech &nbsp;|&nbsp; <a href="https://makostech.me">makostech.me</a></p>
      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="https://makostech.me/">Home</a>
        <a href="https://makostech.me/about">About</a>
        <a href="https://makostech.me/contact">Contact</a>
        <a href="https://makostech.me/blog">Blog</a>
      </nav>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="main.js"></script>
</body>
</html>
